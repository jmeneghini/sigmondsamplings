[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmondsamplings"
version = "0.1.0"
description = "A package for working with resampling files produced by Sigmond"
readme = "README.md"
authors = [
    {name = "John Meneghini", email = "jmeneghini@andrew.cmu.edu"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific :: Physics",
]
requires-python = ">=3.8"
dependencies = [
    'numpy>=1.20.0',
    'scipy>=1.7.0',
    'uncertainties>=3.0',
    'h5py>=3.0.0'
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/jmeneghini/sigmondsamplings"
Repository = "https://github.com/jmeneghini/sigmondsamplings"
Issues = "https://github.com/jmeneghini/sigmondsamplings/issues"

[project.scripts]
sigmond-convert = "sigmondsamplings.scripts.sigmond_convert:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sigmondsamplings*"]