[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmondsamplings"
version = "0.1.0"
description = "A package for working with resampling files produced by Sigmond"
readme = "README.md"
authors = [
    {name = "John Meneghini", email = "jmeneghini@andrew.cmu.edu"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific :: Physics",
]
requires-python = ">=3.8"
dependencies = [
    'numpy>=1.20.0',
    'scipy>=1.7.0',
    'uncertainties>=3.0',
    'h5py>=3.0.0',
    'xarray>=2023.1.0',
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/jmeneghini/sigmondsamplings"
Repository = "https://github.com/jmeneghini/sigmondsamplings"
Issues = "https://github.com/jmeneghini/sigmondsamplings/issues"

[project.scripts]
sigmond-convert = "sigmondsamplings.scripts.sigmond_convert:main"
sigmond-combine = "sigmondsamplings.scripts.sigmond_combine:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sigmondsamplings*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Select which rules to enforce:
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes (undefined variables, unused imports)
    "I",  # isort (automatically sort imports)
    "UP", # pyupgrade (upgrade syntax to modern Python)
]
# Ignore specific rules if needed
ignore = ["E501"]

# Allow auto-fixing for all enabled rules (when `--fix` is passed)
fixable = ["ALL"]
