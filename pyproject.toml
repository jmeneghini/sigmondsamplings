[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmondsamplings"
version = "0.5.0"
description = "A python package for manipulating and analyzing lattice QCD sampling data in sigmond format."
readme = "README.md"
authors = [
    {name = "John Meneghini", email = "jmeneghini@andrew.cmu.edu"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    'numpy>=1.20.0',
    'scipy>=1.7.0',
    'uncertainties>=3.0',
    'h5py>=3.0.0',
    'xarray>=2023.1.0',
    'typer>=0.12',
    'rich>=13',
    'lazy_loader>=0.3',
    'tomlkit>=0.12',
    'pydantic>=2',
]

[project.optional-dependencies]
fitting = [
    "optimagic",
    "threadpoolctl",
    "tqdm",
]
plot = [
    "matplotlib>=3.7",
    "plotly>=5.15"
]
dev = [
    "pytest>=7.0",
    "ruff>=0.15",
    "sigmondsamplings[fitting,plot]"
]

[project.urls]
Homepage = "https://github.com/jmeneghini/sigmondsamplings"
Repository = "https://github.com/jmeneghini/sigmondsamplings"
Issues = "https://github.com/jmeneghini/sigmondsamplings/issues"

[project.scripts]
ss = "sigmondsamplings.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sigmondsamplings*", "slat*"]

[tool.setuptools.package-data]
sigmondsamplings = ["py.typed", "*.pyi"]
slat = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Select which rules to enforce:
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes (undefined variables, unused imports)
    "I",  # isort (automatically sort imports)
    "UP", # pyupgrade (upgrade syntax to modern Python)
]
# Ignore specific rules if needed
ignore = ["E501"]

# Allow auto-fixing for all enabled rules (when `--fix` is passed)
fixable = ["ALL"]