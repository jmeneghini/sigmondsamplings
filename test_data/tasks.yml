        # rotate_by_samplings: True

  - fit_spectrum:
      averaged_input_correlators_dir:
        - /latticeQCD/raid7/phi_rho_model/colin/g1000_imp/s32_t48/phirho_s32_t48_mp0100_mr0310_lp0250_lr1000_g1000.bins
      reference_particle: Phi
      non_interacting_energy_sums: False
      thresholds: [ [Phi, Phi], [Phi, Phi, Phi, Phi] ]
      # plot: False
      # generate_estimates: False
      create_pickles: False
      # do_interacting_fits: False
      summary_plot_max_levels: 0
      use_overlaps_for_ratio: True
      run_tag: 6-27-25-no_ratio_interacting_vev_sub
      single_hadrons:
        Phi:
          - isosinglet S=0 P=(0,0,0) A1g_1 Phi(0) 0
          - isosinglet S=0 P=(0,0,1) A1_1 Phi(1) 0
          - isosinglet S=0 P=(0,1,1) A1_1 Phi(2) 0
          - isosinglet S=0 P=(1,1,1) A1_1 Phi(3) 0
        Rho:
          - isosinglet S=0 P=(0,0,0) A1g_1 Rho(0) 0
          - isosinglet S=0 P=(0,0,1) A1_1 Rho(1) 0
          - isosinglet S=0 P=(0,1,1) A1_1 Rho(2) 0
          - isosinglet S=0 P=(1,1,1) A1_1 Rho(3) 0

      only:
          - isosinglet S=0 A1g_1 PSQ=0
          - isosinglet S=0 A1_1 P=(0,0,1)
          - isosinglet S=0 A1_1 P=(0,1,1)
          - isosinglet S=0 A1_1 P=(1,1,1)

      tN: 3
      t0: 3
      tD: 6

      non_interacting_levels:
        isosinglet S=0 A1g_1 PSQ=0: [['Phi(0)'], ['Phi(0)', 'Phi(0)'], ['Phi(1)', 'Phi(1)'], ['Phi(1)', 'Phi(1)'], ['Phi(2)', 'Phi(2)'], ['Phi(3)', 'Phi(3)'], ['Phi(3)', 'Phi(3)']]
        isosinglet S=0 A1_1 P=(0,0,1): [['Phi(1)'], ['Phi(1)', 'Phi(0)'], ['Phi(1)', 'Phi(0)'], ['Phi(2)', 'Phi(1)'], ['Phi(3)', 'Phi(1)'], ['Phi(3)', 'Phi(2)']]
        isosinglet S=0 A1_1 P=(0,1,1): [['Phi(2)'], ['Phi(0)', 'Phi(2)'], ['Rho(2)'], ['Phi(1)', 'Phi(1)'],
                                        ['Phi(1)', 'Phi(3)'], ['Phi(2)', 'Phi(2)'], ['Phi(2)', 'Phi(2)'], ['Phi(2)', 'Phi(3)']]
        isosinglet S=0 A1_1 P=(1,1,1): [['Phi(3)'], ['Phi(0)', 'Phi(3)'], ['Rho(3)'], ['Phi(1)', 'Phi(2)'], ['Phi(1)', 'Phi(2)'], ['Phi(1)', 'Phi(2)'], ['Phi(1)', 'Phi(2)']]


      default_interacting_corr_fit:
        model: 1-exp
        tmin: 3
        tmax: 14
        ratio: false
        tmin_plots:
        # - model: 1-exp
        #   tmin_min: 3 # bring down
        #   tmin_max: 8
        #   ratio: true
        #   tmax: 14
        # - model: geom
        #   tmin_min: 2
        #   tmin_max: 8
        #   ratio: false
        #   tmax: 25
        - model: 1-exp
          tmin_min: 3 # bring down
          tmin_max: 8
          ratio: false
          tmax: 14
        # - model: 1-exp-sym
        #   tmin_min: 3
        #   tmin_max: 15

      default_noninteracting_corr_fit:
        model: 1-exp
        tmin: 3
        tmax: 12
        # tmin_plots:
        # - model: 2-exp
        #   tmin_min: 3
        #   tmin_max: 9
        # - model: 1-exp
        #   tmin_min: 3
        #   tmin_max: 9
        # - model: geom
        #   tmin_min: 3
        #   tmin_max: 5


      correlator_fits:
        #single hadrons
        isosinglet S=0 P=(0,0,0) A1g_1 Phi(0) 0:
          model: 1-exp-sym
          tmin: 3
          tmax: 15

        isosinglet S=0 P=(0,0,1) A1_1 Phi(1) 0:
          model: 1-exp-sym-const
          tmin: 3
          tmax: 15

        #interacting
        isosinglet S=0 P=(0,0,0) A1g_1 ROT 0:
          model: 1-exp-sym
          tmin: 3
          tmax: 15
          ratio: false

        isosinglet S=0 P=(0,0,0) A1g_1 ROT 1:
          model: 1-exp-sym-const
          tmin: 3
          tmax: 15
          ratio: false

        isosinglet S=0 P=(0,0,1) A1_1 ROT 0:
          model: 1-exp-sym
          tmin: 3
          tmax: 15
          ratio: false

        isosinglet S=0 P=(0,0,1) A1_1 ROT 1:
          model: 1-exp-sym-const
          tmin: 3
          tmax: 15
          ratio: false

        isosinglet S=0 P=(0,1,1) A1_1 ROT 0:
          model: 1-exp-sym
          tmin: 3
          tmax: 15
          ratio: false

        isosinglet S=0 P=(0,1,1) A1_1 ROT 1:
          model: 1-exp-sym-const
          tmin: 3
          tmax: 15
          ratio: false
        # isosinglet S=0 P=(0,0,0) A1g_1 ROT 1:
        #   model: 2-exp-sym
        #   tmin: 3
        #   tmax: 15
        #   ratio: false
