# .pre-commit-config.yaml
repos:
  # Standard file cleanup hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  # Python Linter and Import Sorter: Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check
        types_or: [ python ]
        args: [ --fix]
      - id: ruff-format
        types_or: [ python ]
